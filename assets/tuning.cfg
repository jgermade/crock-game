# Constantes de movimiento de cROCK. Se recargan en caliente al guardar.
# Unidades: píxeles de juego (tiles de 8 px) y segundos. Eje Y hacia abajo.
# Borra una línea para volver al valor por defecto.

run_speed           = 90     # px/s
run_accel           = 1000   # px/s²
run_reduce          = 400    # px/s², frenado al ir por encima de run_speed
air_mult            = 0.65   # control horizontal en el aire

gravity             = 900    # px/s²
max_fall            = 160    # px/s
fast_max_fall       = 240    # px/s manteniendo abajo

jump_speed          = 105    # px/s
jump_h_boost        = 40     # px/s extra al saltar con dirección
var_jump_time       = 0.2    # s que mantener el botón sostiene la subida
half_grav_threshold = 40     # px/s: media gravedad en el ápice si se mantiene salto

coyote_time         = 0.1    # s
jump_buffer         = 0.09   # s

# --- Golpe con la porra (Fase 2) ---
strike_speed        = 210    # px/s del impulso (opuesto a la dirección del golpe)
strike_steer        = 0      # px/s de empuje extra del stick en el impacto (0 = exactamente opuesto)
strike_float        = 0.06   # s sin gravedad ni control tras el impacto
strike_window       = 0.07   # s de ventana activa: el golpe conecta si algo entra en la caja
strike_cooldown     = 0.15   # s tras un golpe fallido
strike_buffer       = 0.1    # s que una pulsación espera si aún no se puede golpear
strike_reach        = 9      # px del centro del jugador al centro de la caja de golpe
strike_size         = 16     # px de lado de la caja de golpe
max_strikes         = 1      # golpes por recarga (suelo, roca, frágil, musgo)
object_cooldown     = 0.35   # s antes de poder golpear de nuevo el mismo objeto
fragile_respawn     = 2.5    # s hasta que reaparece una roca frágil
bone_mult           = 1.35   # impulso del hueso (no recarga)
moss_mult           = 0.7    # impulso del musgo
hitstop             = 0.05   # s de congelación en el impacto
shake_time          = 0.12   # s de temblor de pantalla

# --- Enemigos (Fase 3) ---
beetle_speed        = 20     # px/s del escarabajo
beetle_stun         = 1.5    # s que queda aturdido (inofensivo) tras golpearlo
bat_speed           = 30     # px/s máximos del murciélago en su vaivén

# --- Cornisas ---
ledge_grab          = 1      # 1: se agarra a las cornisas al saltar empujando hacia la pared (y recarga el golpe)
ledge_reach         = 6      # px de margen entre las manos y el borde
ledge_rise          = 30     # px/s: subiendo más rápido que esto no se agarra
ledge_regrab        = 0.25   # s tras soltarse antes de poder agarrarse otra vez
